# use Ctrl+A as the prefix key
unbind C-b
set -g prefix C-a

# TODO: some features don't work, use tokyonight theme
source-file ~/dotfiles/shell/tokyonight.tmuxtheme

# extrakto through tpm
# macOS Bash tends to be outdated, update it first
set -g @plugin 'laktak/extrakto'

# reload config file
bind r source-file ~/.tmux.conf \; display ".tmux.conf reloaded"

# unbind v & h keys just in case tmux itself uses it in future versions
unbind v
unbind h

# unbind default verical and horizontal pane splits
unbind %
unbind '"'

# bind v to vertical split and h to horizontal
# apparently some folks are confused by this: https://github.com/tmux/tmux/issues/213
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# use vim style navigation over panes
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# increase history size
set -g history-limit 100000

unbind n  #DEFAULT KEY: Move to next window
unbind w  #DEFAULT KEY: change current window interactively

# prefix + w - new window, prefix +  n - rename current window
bind n command-prompt "rename-window '%%'"
bind w new-window -c "#{pane_current_path}"

# change window & pane index to 1-based instead of 0-based
set -g base-index 1
set-window-option -g pane-base-index 1

# TODO: might need to unbind first, doesn't work for now
# option + j & option + k for next, previous window
bind -n M-j previous-window
bind -n M-k next-window

# set up tmux plugin manager
set -g @plugin 'tmux-plugins/tpm'

# run tpm, needs to be at EOL
run -b '~/.tmux/plugins/tpm/tpm'
